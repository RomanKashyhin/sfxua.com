<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFX Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1013; --panel: #15181d; --panel-2: #1c2026; --panel-3: #232830; --line: #2a3039; --line-2: #343b46;
    --text: #e9ecf0; --muted: #8b94a1; --dim: #5f6873;
    --accent: #f5b84a; --accent-2: #4fd1a1; --violet: #a78bfa; --teal: #38bdf8; --danger: #ef6a5f;
    --track: #2b313a; --glow: 0 0 0 3px rgba(245,184,74,.18);
    --r: 10px; --r-s: 7px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13.5px/1.45 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .app { display: grid; height: 100vh; grid-template-columns: 300px 1fr 320px; grid-template-rows: 52px 1fr; }

  /* ---------- шапка ---------- */
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: linear-gradient(180deg, #181c22, #15181d); border-bottom: 1px solid var(--line);
  }
  header .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .14em; font-size: 13px; color: var(--accent); }
  header .logo i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; }
  header .project { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  .btn, header button {
    display: inline-flex; align-items: center; gap: 7px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-s); padding: 7px 12px; cursor: pointer; font: inherit; font-size: 12.5px; line-height: 1;
    transition: border-color .12s, background .12s, color .12s;
  }
  .btn:hover, header button:hover { border-color: var(--line-2); background: var(--panel-3); }
  .btn:active { transform: translateY(1px); }
  .btn.small { padding: 5px 9px; font-size: 12px; }
  .btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(245,184,74,.08); }

  aside, main { min-height: 0; overflow: auto; }
  aside { background: var(--panel); padding: 14px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }
  h3 { display: flex; align-items: center; gap: 6px; margin: 14px 0 10px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h3:first-child { margin-top: 0; }

  /* ---------- вкладки наборов ---------- */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel-2); cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 500; transition: all .12s;
  }
  .tab:hover { color: var(--text); border-color: var(--line-2); }
  .tab.active { color: var(--text); background: var(--panel-3); border-color: var(--kind, var(--accent)); box-shadow: inset 0 0 0 1px var(--kind, var(--accent)); }
  .tab[data-kind=loop] { --kind: var(--teal); } .tab[data-kind=steps] { --kind: var(--accent); } .tab[data-kind=whoosh] { --kind: var(--violet); }
  .tab .ico { color: var(--kind, var(--accent)); }

  /* ---------- карточки слоёв ---------- */
  .layer {
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto auto; gap: 3px 8px;
    padding: 9px 11px; margin-bottom: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r);
  }
  .layer .name { font-weight: 600; font-size: 13px; }
  .layer .mode { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .ms { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 4px; align-items: center; }
  .layer .ms button {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted);
    cursor: pointer; font-size: 11px; font-weight: 700;
  }
  .layer .ms button.on-m { background: var(--danger); color: #fff; border-color: var(--danger); }
  .layer .ms button.on-s { background: var(--accent-2); color: #0b1a14; border-color: var(--accent-2); }
  .layer .meter { grid-column: 1 / span 2; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .layer .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), #b9f5de); }
  .layer .gain { grid-column: 1 / span 2; }
  .layer.muted { opacity: .45; }
  .layer.empty { border-style: dashed; }
  .add-layer {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; margin-top: 4px;
    border: 1px dashed var(--line-2); border-radius: var(--r); background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: 12.5px;
  }
  .add-layer:hover { border-color: var(--muted); color: var(--text); }

  /* ---------- центр ---------- */
  main { display: flex; flex-direction: column; background: #0a0c0f; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
  .stage video { max-width: 100%; max-height: 100%; background: #000; display: none; }
  .stage.loaded video { display: block; }
  .drop {
    position: absolute; inset: 24px; border: 2px dashed var(--line-2); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); pointer-events: none;
  }
  .drop .ico { width: 40px; height: 40px; stroke-width: 1.5; color: var(--dim); }
  .drop.hidden { display: none; }
  .stage.over .drop { border-color: var(--accent); color: var(--accent); }
  .transport {
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: auto auto 1fr auto auto auto; gap: 12px; align-items: center;
  }
  .transport .play {
    width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--accent); color: #1a1408; cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 4px 16px rgba(245,184,74,.25);
  }
  .transport .play .ico { width: 18px; height: 18px; fill: currentColor; stroke: none; }
  .transport .play .i-pause { display: none; }
  .transport .play.playing .i-play { display: none; }
  .transport .play.playing .i-pause { display: block; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .time b { color: var(--text); font-weight: 600; }
  .scrub { position: relative; height: 28px; }
  .scrub input { width: 100%; }
  .scrub .loop { position: absolute; top: 11px; height: 6px; background: var(--accent); opacity: .35; border-radius: 3px; pointer-events: none; }
  .loopbtns { display: flex; gap: 4px; }
  #vidMute .i-on { display: none; }
  #vidMute.on .i-on { display: block; } #vidMute.on .i-off { display: none; }

  /* ---------- крутилки ---------- */
  .knob { position: relative; display: grid; place-items: center; width: 58px; height: 58px; cursor: ns-resize; user-select: none; touch-action: none; --kc: var(--accent); }
  .knob.mini { width: 36px; height: 36px; --kc: var(--accent-2); }
  .k-tick { stroke: rgba(255,255,255,.14); stroke-width: 1.2; stroke-linecap: round; }
  .k-rim { fill: none; stroke: rgba(0,0,0,.55); stroke-width: 1.5; }
  .k-hl { fill: rgba(255,255,255,.07); }
  .k-dot { fill: var(--kc); }
  .knob.drag .k-hl { fill: rgba(255,255,255,.13); }
  .knob.drag .k-ptr, .knob.drag .k-dot { filter: drop-shadow(0 0 6px var(--kc)); }
  .k-float { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -100%); padding: 4px 14px; border-radius: 8px;
    background: #0a0c10; border: 1px solid var(--kc, var(--accent)); color: var(--kc, var(--accent)); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
    box-shadow: 0 0 18px color-mix(in srgb, var(--kc, var(--accent)) 45%, transparent), inset 0 0 14px color-mix(in srgb, var(--kc, var(--accent)) 22%, transparent); }
  .knob svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .knob .k-src { display: none; }
  .k-track { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 4; stroke-linecap: round; }
  .k-arc { fill: none; stroke: var(--kc); stroke-width: 4; stroke-linecap: round; }
  .k-body { fill: url(#k-grad); stroke: rgba(255,255,255,.09); stroke-width: 1; }
  .k-ptr { stroke: var(--kc); stroke-width: 3.2; stroke-linecap: round; }
  .knob:hover .k-body, .knob.drag .k-body { stroke: rgba(255,255,255,.25); }
  .knob.drag .k-arc { filter: drop-shadow(0 0 5px var(--kc)); }

  /* ---------- макросы: сетка крутилок ---------- */
  #macros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .macro { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 6px 8px; text-align: center;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
  .macro.idle { opacity: .45; }
  .macro .row { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; }
  .macro .row .label { font-weight: 600; font-size: 12.5px; }
  .macro .val { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; font-weight: 600; min-width: 5ch; text-align: center; padding: 2px 10px;
    border-radius: 6px; background: #0a0c10; border: 1px solid var(--line-2);
    box-shadow: inset 0 0 14px color-mix(in srgb, var(--accent) 18%, transparent); }
  .macro .hint { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
  .macro.dist { grid-column: 1 / -1; }
  .master .macro { display: block; text-align: left; }
  .master .macro .row { justify-content: space-between; }
  .master .macro .val { display: inline-block; margin-top: 0; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--accent) 0 var(--p, 50%), var(--track) var(--p, 50%) 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  input[type=range]:hover::-webkit-slider-thumb { box-shadow: var(--glow), 0 2px 8px rgba(0,0,0,.5); }
  input[type=range].thin { height: 20px; }
  input[type=range].thin::-webkit-slider-runnable-track {
    height: 4px; background: linear-gradient(to right, var(--accent-2) 0 var(--p, 50%), var(--track) var(--p, 50%) 100%);
  }
  input[type=range].thin::-webkit-slider-thumb { width: 13px; height: 13px; margin-top: -4.5px; border-width: 2px; border-color: var(--accent-2); }
  input[type=range].scrubber::-webkit-slider-runnable-track { height: 6px; background: linear-gradient(to right, var(--text) 0 var(--p, 0%), var(--track) var(--p, 0%) 100%); }
  input[type=range].scrubber::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -4px; border-width: 2px; border-color: var(--text); }

  /* ---------- панели наборов (выборы, кнопки, блоки слоёв) ---------- */
  .sel { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-s); padding: 6px 8px; font: inherit; font-size: 12.5px; width: 100%;
    appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 24px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .trig { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 6px; }
  .trig .btn { flex: 1 1 auto; justify-content: center; padding: 9px 6px; font-size: 12px; }
  .trig .btn.walk.on { border-color: var(--accent-2); color: var(--accent-2); background: rgba(79,209,161,.08); }
  .trig .btn.go { border-color: var(--violet); color: var(--violet); font-weight: 600; background: rgba(167,139,250,.08); }
  .progress { font-size: 11px; color: var(--muted); margin: 4px 0 6px; min-height: 14px; }
  #charRow select { margin-bottom: 10px; }
  .macro .tog { width: 18px; height: 18px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; }
  .subs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-around; gap: 6px 4px; margin: -4px 0 4px; padding: 8px 4px;
    border: 1px dashed var(--line-2); border-radius: var(--r); background: rgba(255,255,255,.015); }
  .subs .macro { flex: 1 1 60px; border: none; background: transparent; padding: 0; gap: 1px; }
  .subs .macro .label { font-weight: 500; font-size: 11px; color: var(--muted); }
  .subs .macro .val { color: var(--accent-2); font-size: 11px; padding: 1px 7px; min-width: 4ch;
    box-shadow: inset 0 0 10px color-mix(in srgb, var(--accent-2) 18%, transparent); }
  .macro.dist .val { min-width: 5ch; }
  .distCurve { width: 100%; height: 72px; display: block; margin-top: 6px; border-radius: var(--r-s); background: var(--track); }
  .subs select.air { width: 100%; margin-bottom: 8px; }

  .wl { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 9px; margin-bottom: 8px; font-size: 12px; background: var(--panel-2); }
  .wl.off { opacity: .45; }
  .wl-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-weight: 600; }
  .wl-head label { display: flex; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
  .wl-head select, .wl-head .btn { max-width: 52%; margin-left: auto; }
  .wl-head .tog { width: 18px; height: 18px; border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 0; font-size: 12px; }
  .wl-head .nm { cursor: pointer; }
  .wl-head .sum { margin-left: auto; font-weight: 400; font-size: 10.5px; color: var(--dim); text-align: right; }
  .wl.closed .bands, .wl.closed .wl-row, .wl.closed canvas { display: none; }
  .wl.closed { padding: 6px 9px; } .wl.closed .wl-head { margin-bottom: 0; }
  .wl-row { display: grid; grid-template-columns: 56px 1fr 50px; align-items: center; gap: 6px; margin-bottom: 3px; }
  .wl-row .lbl { color: var(--muted); }
  .wl-row .val { font-variant-numeric: tabular-nums; color: var(--accent-2); font-size: 11px; text-align: right; }
  .wl-row select { font-size: 11px; padding: 3px 20px 3px 6px; }
  .wl canvas.env { width: 100%; height: 56px; display: block; margin-top: 4px; border-radius: var(--r-s); background: var(--track); cursor: crosshair; touch-action: none; }
  .bands { display: grid; gap: 2px; }
  .band-h, .band { display: grid; grid-template-columns: 62px 1fr 1fr 1fr; gap: 6px; align-items: center; }
  .band-h span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .band label { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; }
  .band.off { opacity: .4; }
  .band .cell { display: grid; }
  .band .cell i { font-style: normal; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -4px; text-align: center; }
  /* стеклянный тумблер со свечением вместо чекбокса */
  input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 30px; height: 16px; margin: 0; border-radius: 999px; position: relative; cursor: pointer; flex: none;
    background: #0a0c10; border: 1px solid var(--line-2); transition: background .15s, border-color .15s, box-shadow .15s; }
  input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #5f6873; transition: left .15s, background .15s; }
  input[type=checkbox]:checked { background: color-mix(in srgb, var(--accent) 35%, #0a0c10); border-color: var(--accent);
    box-shadow: inset 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); }
  input[type=checkbox]:checked::after { left: 16px; background: #fff; }
  .band .cell { justify-items: center; }
  .band .cell i { margin-top: -2px; }
  .wl-row .knob { justify-self: center; }

  /* ---------- экран-схема ---------- */
  main { position: relative; }
  .viewmode { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; background: rgba(14,16,19,.75); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); }
  .viewmode button { border: none; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 5px 14px; border-radius: 999px; cursor: pointer; }
  .viewmode button.on { background: var(--panel-3); color: var(--text); }
  .graph { display: none; flex: 1; min-height: 0; overflow: auto; padding: 52px 18px 18px; --g: var(--accent);
    background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.035), transparent 60%),
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 28px 28px,
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 28px 28px, #07090d; }
  main.graph-mode .graph { display: block; }
  main.graph-mode .stage { position: absolute; left: 50%; top: 60px; width: 300px; height: 170px; z-index: 5; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0,0,0,.6); background: #000; }
  .g-mid { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .g-video-slot { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; }
  main.graph-mode .stage .drop { inset: 10px; font-size: 11px; }
  .g-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .g-tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(255,255,255,.03); }
  .g-tile .ico { color: var(--g); width: 15px; height: 15px; }
  .g-tile i { display: block; font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .g-tile b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .g-body { position: relative; display: grid; grid-template-columns: minmax(170px, 232px) auto minmax(170px, 232px); gap: 12px; align-items: start; justify-content: center; min-height: 420px; }
  .g-side { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-top: 180px; min-width: 0; align-self: stretch; }
  .g-side.right { align-items: center; }
  .g-mid { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .g-video-slot { width: 300px; aspect-ratio: 16 / 9; border-radius: 12px; }
  main.graph-mode .stage .drop { inset: 10px; font-size: 11px; }
  /* дольки слоёв */
  .g-pie-wrap { position: relative; --g2: var(--g); }
  .g-pie { width: 100%; height: 100%; display: block; overflow: visible; }
  .g-wedge { cursor: ns-resize; }
  .w-frame { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.1); stroke-width: 1; stroke-linejoin: round; }
  .w-fill { fill: var(--wf, #ddd); stroke: var(--wf, #ddd); stroke-width: 3; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
  .g-wedge:hover .w-fill, .g-wedge.drag .w-fill { fill: #fff; stroke: #fff; }
  .g-wedge.target .w-fill { fill: var(--g); stroke: var(--g); }
  .g-wedge.off .w-fill { fill: transparent; stroke: rgba(255,255,255,.3); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .w-lv { fill: var(--g); opacity: 0; pointer-events: none; }
  @keyframes w-hit { from { fill: var(--g); stroke: var(--g); } to { fill: var(--wf); stroke: var(--wf); } }
  .g-wedge.hit .w-fill { animation: w-hit .45s ease-out; }
  .w-num, .w-lbl { text-anchor: middle; pointer-events: none; fill: #15181d; font-family: Inter, system-ui, sans-serif; }
  .w-num { font-size: 15px; font-weight: 700; } .w-lbl { font-size: 9.5px; font-weight: 500; }
  .g-wedge.lite .w-num, .g-wedge.lite .w-lbl { fill: rgba(255,255,255,.8); }
  .g-wedge.off .w-num, .g-wedge.off .w-lbl { fill: var(--muted); }
  .g-wedge.off .w-frame { stroke-dasharray: 3 3; }
  /* кольцо модулей на всём наборе */

<div class="app">
  <header>
    <span class="logo"><i></i>SFX LAB</span>
    <span class="project" id="projectName">проект не открыт</span>
    <span class="spacer"></span>
    <button id="openVideo"><svg class="ico"><use href="#i-film"/></svg>Видео…</button>
    <input type="file" id="videoFile" accept="video/*" hidden>
    <button id="openProject"><svg class="ico"><use href="#i-folder"/></svg>Проект…</button>
    <input type="file" id="projectFile" accept=".json" hidden>
    <button id="saveProject"><svg class="ico"><use href="#i-save"/></svg>Сохранить</button>
    <button id="exportBtn" class="primary" title="E: выгнать текущий набор WAV-файлами слоями"><svg class="ico"><use href="#i-layers"/></svg>Выгнать WAV</button>
  </header>

  <aside class="left">
    <h3><svg class="ico"><use href="#i-grid"/></svg>Наборы</h3>
    <div class="tabs" id="tabs"></div>
    <label class="hearall" data-tip="<b>Слышать все наборы</b><p>По умолчанию звучит только набор открытой вкладки: открыл «Шаги» — эмбиент замолчал. Включи, чтобы слушать всё вместе.</p>"><input type="checkbox" id="hearAll"><span>слышать все наборы</span></label>
    <div id="setPanel"></div>
    <h3><svg class="ico"><use href="#i-layers"/></svg>Слои</h3>
    <div id="layers"></div>
    <button class="add-layer" id="addLayer"><svg class="ico"><use href="#i-plus"/></svg>слой из wav</button>
    <input type="file" id="layerFile" accept="audio/*" multiple hidden>
  </aside>

  <main id="main">
    <div class="viewmode"><button class="on" data-view="video" title="V: видео на весь центр">видео</button><button data-view="graph" title="V: схема слоёв">схема</button></div>
    <div id="graphView" class="graph"></div>
    <div class="stage" id="stage">
      <video id="video" playsinline></video>
      <div class="drop" id="drop">
        <svg class="ico"><use href="#i-film"/></svg>
        <div>Перетащи видео сюда или нажми «Видео…»</div>
      </div>
    </div>
    <div class="transport">
      <button class="play" id="play" title="пробел"><svg class="ico i-play"><use href="#i-play"/></svg><svg class="ico i-pause"><use href="#i-pause"/></svg></button>
      <div class="time"><b id="tCur">00:00.00</b> / <span id="tDur">00:00.00</span></div>
      <div class="scrub">
        <div class="loop" id="loopBar" style="display:none"></div>
        <input type="range" class="scrubber" id="scrub" min="0" max="1000" value="0">
      </div>
      <div class="loopbtns">
        <button class="btn small" id="loopA" title="[">A</button>
        <button class="btn small" id="loopB" title="]">B</button>
        <button class="btn small" id="loopOn" title="L"><svg class="ico"><use href="#i-repeat"/></svg></button>
      </div>
      <button class="btn small" id="stop" title="Home"><svg class="ico"><use href="#i-skip-back"/></svg></button>
      <button class="btn small" id="vidMute" title="M: звук самого видео (не слоёв)"><svg class="ico i-off"><use href="#i-vol-x"/></svg><svg class="ico i-on"><use href="#i-vol"/></svg>видео</button>
    </div>
  </main>

  <aside class="right">
    <h3><svg class="ico"><use href="#i-sliders"/></svg><span id="macroTitle">Ползунки</span></h3>
    <div id="charRow"></div>
    <div class="snap">
      <button class="btn" id="snapA">A</button>
      <button class="btn" id="snapB">B</button>
      <button class="btn" id="reset">сброс</button>
    </div>
    <div id="macros"></div>
    <h3 id="fxTitle" data-tip="<b>Модули на всём наборе</b><p>Те же блоки, что в ряду под кругом на схеме: все слои вместе, перед дистанцией. Модули на отдельных ниточках видны только на схеме.</p>"><svg class="ico"><use href="#i-layers"/></svg>Модули на всём наборе</h3>
    <div id="fx"></div>
    <div class="master">
      <div class="macro">
        <div class="row"><span class="label">Мастер</span><span class="val" id="masterVal">80</span></div>
        <input type="range" id="master" min="0" max="100" value="80">
        <div class="meter"><i id="masterMeter"></i></div>
      </div>
    </div>
  </aside>
</div>
<div class="status">звук: <b id="audioState">проект не загружен</b></div>
<div class="modal hidden" id="exportModal"><div class="modal-box" id="exportBox"></div></div>

<script src="distance.js"></script>
<script src="steps.js"></script>
<script src="whoosh.js"></script>
<script src="graph.js"></script>
<script src="fx.js"></script>
<script src="ui.js"></script>
<script src="knob.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>

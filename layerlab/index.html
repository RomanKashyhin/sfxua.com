<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerLab</title>
<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --panel-2: #23272c; --line: #2d3238;
    --text: #e6e8ea; --muted: #8b939c; --accent: #f2b544; --accent-2: #5dd0a0;
    --danger: #e0645a; --track: #30353b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden;
  }
  .app {
    display: grid; height: 100vh;
    grid-template-columns: 260px 1fr 300px;
    grid-template-rows: 44px 1fr;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 16px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .logo { font-weight: 700; letter-spacing: .08em; color: var(--accent); }
  header .project { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header button, .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  header button:hover, .btn:hover { border-color: var(--muted); }
  .btn.small { padding: 3px 8px; font-size: 12px; }

  aside, main { min-height: 0; overflow: auto; }
  aside { background: var(--panel); padding: 14px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }
  h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* наборы слоёв */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel-2); cursor: pointer; color: var(--muted);
  }
  .tab.active { color: var(--text); border-color: var(--accent); background: #2a2a22; }
  .layer {
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto auto;
    gap: 4px 8px; padding: 8px 10px; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  }
  .layer .name { font-weight: 600; }
  .layer .mode { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .ms { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 4px; align-items: center; }
  .layer .ms button {
    width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 700;
  }
  .layer .ms button.on-m { background: var(--danger); color: #fff; border-color: var(--danger); }
  .layer .ms button.on-s { background: var(--accent-2); color: #111; border-color: var(--accent-2); }
  .layer .meter { grid-column: 1 / span 2; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .layer .meter i { display: block; height: 100%; width: 0; background: var(--accent-2); }
  .layer .gain { grid-column: 1 / span 2; }
  .layer.muted { opacity: .45; }
  .layer.empty { border-style: dashed; }
  .add-layer {
    width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 8px;
    background: transparent; color: var(--muted); cursor: pointer; font: inherit;
  }
  .add-layer:hover { border-color: var(--muted); color: var(--text); }

  /* центр */
  main { display: flex; flex-direction: column; background: #0f1113; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
  .stage video { max-width: 100%; max-height: 100%; background: #000; display: none; }
  .stage.loaded video { display: block; }
  .drop {
    position: absolute; inset: 24px; border: 2px dashed var(--line); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); pointer-events: none;
  }
  .drop.hidden { display: none; }
  .stage.over .drop { border-color: var(--accent); color: var(--accent); }
  .transport {
    padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: auto auto 1fr auto auto auto; gap: 12px; align-items: center;
  }
  .transport .play {
    width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent);
    color: #111; font-size: 16px; cursor: pointer;
  }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .time b { color: var(--text); font-weight: 600; }
  .scrub { position: relative; height: 28px; }
  .scrub input { width: 100%; }
  .scrub .loop { position: absolute; top: 11px; height: 6px; background: var(--accent); opacity: .35; border-radius: 3px; pointer-events: none; }
  .loopbtns { display: flex; gap: 4px; }
  .loopbtns .btn.on { border-color: var(--accent); color: var(--accent); }

  /* ползунки */
  .macro { margin-bottom: 18px; }
  .macro.idle { opacity: .45; }
  .macro .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .macro .label { font-weight: 600; }
  .macro .val { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 13px; min-width: 3ch; text-align: right; }
  .macro .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, var(--accent) 0 var(--p, 50%), var(--track) var(--p, 50%) 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%;
    background: #f7f7f7; border: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range].thin::-webkit-slider-runnable-track {
    height: 4px; background: linear-gradient(to right, var(--accent-2) 0 var(--p, 50%), var(--track) var(--p, 50%) 100%);
  }
  input[type=range].thin::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -5px; border-width: 2px; border-color: var(--accent-2); }
  input[type=range].scrubber::-webkit-slider-runnable-track { height: 6px; background: linear-gradient(to right, var(--text) 0 var(--p, 0%), var(--track) var(--p, 0%) 100%); }
  input[type=range].scrubber::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -4px; border-width: 2px; border-color: var(--text); }


  /* набор шагов: выбор и кнопки */
  .sel { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 13px; width: 100%; }
  .trig { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 6px; }
  .trig .btn { flex: 1 1 auto; padding: 8px 6px; font-size: 12px; text-align: center; }
  .trig .btn.walk.on { border-color: var(--accent-2); color: var(--accent-2); }
  .progress { font-size: 11px; color: var(--muted); margin-bottom: 12px; min-height: 14px; }
  #charRow select { margin-bottom: 10px; }
  /* подползунки */
  .macro .tog { width: 20px; height: 20px; margin-right: 6px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; }
  .macro .row { align-items: center; }
  .macro .row .label { flex: 1; }
  .subs { margin: -8px 0 16px 26px; padding-left: 10px; border-left: 2px solid var(--line); }
  .subs .macro { margin-bottom: 6px; }
  .subs .macro .label { font-weight: 400; font-size: 13px; color: var(--muted); }
  .subs .macro .val { color: var(--accent-2); }
  .macro.dist .val { min-width: 5ch; }
  .distCurve { width: 100%; height: 72px; display: block; margin-top: 6px; border-radius: 6px; background: var(--track); }
  .subs select.air { width: 100%; margin-bottom: 8px; }
  /* вжухи: блок слоя слева */
  .trig .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .wl { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 12px; }
  .wl.off { opacity: .45; }
  .wl-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; font-weight: 600; }
  .wl-head select, .wl-head .btn { max-width: 55%; }
  .wl-row { display: grid; grid-template-columns: 58px 1fr 48px; align-items: center; gap: 6px; margin-bottom: 4px; }
  .wl-row .lbl { color: var(--muted); }
  .wl-row .val { font-variant-numeric: tabular-nums; color: var(--accent-2); font-size: 11px; text-align: right; }
  .wl-row select { font-size: 11px; padding: 2px 4px; }
  .wl-row input[type=range] { width: 100%; }
  .wl canvas.env { width: 100%; height: 56px; display: block; margin-top: 4px; border-radius: 6px; background: var(--track); cursor: crosshair; touch-action: none; }
  .snap { display: flex; gap: 6px; margin: 6px 0 18px; }
  .snap .btn { flex: 1; text-align: center; }
  .snap .btn.on { border-color: var(--accent); color: var(--accent); }
  .master { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); }
  .master .meter { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 4px; }
  .master .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  .status { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: var(--muted); }
  .status b { color: var(--accent-2); }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">LAYERLAB</span>
    <span class="project" id="projectName">проект не открыт</span>
    <span class="spacer"></span>
    <button id="openVideo">Открыть видео…</button>
    <input type="file" id="videoFile" accept="video/*" hidden>
    <button id="openProject">Открыть проект…</button>
    <input type="file" id="projectFile" accept=".json" hidden>
    <button id="saveProject">Сохранить проект</button>
  </header>

  <aside class="left">
    <h3>Наборы слоёв</h3>
    <div class="tabs" id="tabs"></div>
    <div id="setPanel"></div>
    <h3>Слои</h3>
    <div id="layers"></div>
    <button class="add-layer" id="addLayer">+ слой (wav)</button>
    <input type="file" id="layerFile" accept="audio/*" multiple hidden>
  </aside>

  <main>
    <div class="stage" id="stage">
      <video id="video" playsinline></video>
      <div class="drop" id="drop">
        <div style="font-size:32px">🎬</div>
        <div>Перетащи видео сюда или нажми «Открыть видео…»</div>
      </div>
    </div>
    <div class="transport">
      <button class="play" id="play" title="пробел">▶</button>
      <div class="time"><b id="tCur">00:00.00</b> / <span id="tDur">00:00.00</span></div>
      <div class="scrub">
        <div class="loop" id="loopBar" style="display:none"></div>
        <input type="range" class="scrubber" id="scrub" min="0" max="1000" value="0">
      </div>
      <div class="loopbtns">
        <button class="btn small" id="loopA" title="[">A</button>
        <button class="btn small" id="loopB" title="]">B</button>
        <button class="btn small" id="loopOn" title="L">loop</button>
      </div>
      <button class="btn small" id="stop" title="Home">⏮</button>
      <button class="btn small" id="vidMute" title="M: звук самого видео (не слоёв)">🔇 видео</button>
    </div>
  </main>

  <aside class="right">
    <h3 id="macroTitle">Ползунки</h3>
    <div id="charRow"></div>
    <div class="snap">
      <button class="btn" id="snapA">A</button>
      <button class="btn" id="snapB">B</button>
      <button class="btn" id="reset">сброс</button>
    </div>
    <div id="macros"></div>
    <div class="master">
      <div class="macro">
        <div class="row"><span class="label">Мастер</span><span class="val" id="masterVal">80</span></div>
        <input type="range" id="master" min="0" max="100" value="80">
        <div class="meter"><i id="masterMeter"></i></div>
      </div>
    </div>
  </aside>
</div>
<div class="status">звук: <b id="audioState">проект не загружен</b></div>

<script src="distance.js"></script>
<script src="steps.js"></script>
<script src="whoosh.js"></script>
<script src="app.js"></script>
</body>
</html>
